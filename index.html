    <style>
      /*
        Splash: painted before any JavaScript, removed by main.tsx once the first screen has drawn. It takes the
        canvas of the system theme (the app's own setting is not read yet) and shows the K with no box around it.
      */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #f6f6f3;
        transition: opacity 0.3s ease;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #0b0b0e;
        }
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 63px;
        height: 72px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="presentation">
      <img src="/brand/k-mark.webp" alt="" width="63" height="72" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
