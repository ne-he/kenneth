<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f2ee" />
    <meta name="description" content="KENNETH: cek kondisi parkir mall di Jakarta sebelum berangkat. Seberapa penuh, antri gerbang berapa menit, dan ke mana kalau penuh." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KENNETH · Cek parkir semudah cek cuaca" />
    <meta property="og:description" content="Seberapa penuh, antri gerbang berapa menit, dan ke mana kalau penuh. Sebelum kamu berangkat." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>KENNETH · Parkir tanpa nebak</title>
    <style>
      /* Splash: painted before any JavaScript, removed by main.tsx once the app is on screen. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #000;
        transition: opacity 0.45s ease;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #splash-logo,
      #splash-video {
        width: min(52vmin, 240px);
        height: auto;
        aspect-ratio: 1;
        display: block;
      }
      #splash-logo,
      #splash-video {
        animation: k-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #splash-video {
        display: none;
      }
      #splash.has-video #splash-video {
        display: block;
      }
      /* Road markings sliding past, the same dashes as the logo's center line. */
      #splash .lane {
        width: 96px;
        height: 4px;
        border-radius: 2px;
        background: repeating-linear-gradient(90deg, #fff 0 14px, transparent 14px 26px);
        background-size: 26px 4px;
        opacity: 0.8;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
        animation: lane 0.55s linear infinite;
      }
      #splash.has-video #splash-logo,
      #splash.has-video .lane {
        display: none;
      }
      @keyframes k-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
      }
      @keyframes lane {
        to {
          background-position: -26px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="presentation">
      <div class="stage">
        <img id="splash-logo" src="/pwa-512.png" alt="" width="240" height="240" />
        <!--splash-video-->
        <div class="lane"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
