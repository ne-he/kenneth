<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Road geometry is generated by work/carousel/road.py so it matches the static slides exactly. -->
    <script src="road.js"></script>
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("assets/PlusJakartaSans.ttf") format("truetype");
        font-weight: 200 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #f6f8f3;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #bg {
        background: linear-gradient(171deg, #f6f8f3 0%, #dceee2 100%);
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        will-change: transform;
      }
      #glow-a {
        left: 50px;
        top: -100px;
        width: 1700px;
        height: 2000px;
        background: radial-gradient(closest-side, rgba(193, 225, 206, 0.44), rgba(193, 225, 206, 0.2) 50%, rgba(193, 225, 206, 0) 100%);
      }
      #glow-b {
        left: -760px;
        top: -560px;
        width: 1520px;
        height: 1240px;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0) 100%);
      }
      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.05;
        mix-blend-mode: multiply;
      }
      #road-svg {
        position: absolute;
        inset: 0;
      }
      .t {
        position: absolute;
        color: #0f2620;
        line-height: 1;
      }
      #wordmark {
        left: 78px;
        top: 57px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1.2px;
      }
      #page {
        left: 923px;
        top: 61px;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      #headline {
        left: 76px;
        top: 207px;
        font-size: 74px;
        font-weight: 620;
        line-height: 89px;
        letter-spacing: -0.5px;
      }
      #sub {
        left: 81px;
        top: 426px;
        color: #4a6359;
        font-size: 23px;
        font-weight: 450;
        line-height: 36px;
      }
      .rule {
        position: absolute;
        left: 80px;
        width: 800px;
        height: 1px;
        background: #a4c3b0;
      }
      .step-label {
        color: #3e6a56;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 2px;
      }
      .step-title {
        font-size: 33px;
        font-weight: 650;
      }
      .step-body {
        color: #4a6359;
        font-size: 20px;
        font-weight: 450;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="7"
      data-width="1080"
      data-height="1350"
    >
      <div id="bg" class="clip" data-start="0" data-duration="7" data-track-index="0">
        <div id="glow-a" class="glow"></div>
        <div id="glow-b" class="glow" data-layout-allow-overflow></div>
        <svg id="grain" width="1080" height="1350" xmlns="http://www.w3.org/2000/svg">
          <filter id="noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#noise)" />
        </svg>
      </div>

      <div id="road-layer" class="clip" data-start="0" data-duration="7" data-track-index="1">
        <svg id="road-svg" data-layout-allow-overflow width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="route-blur" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="9" />
            </filter>
            <filter id="car-shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" />
            </filter>
            <linearGradient id="core-grad" gradientUnits="userSpaceOnUse" x1="-90.0" y1="130.0" x2="1170.0" y2="1270.0">
              <stop id="core-a" offset="0" />
              <stop id="core-b" offset="1" />
            </linearGradient>
          </defs>
          <g id="streets"></g>
          <path id="bed" d="M-90.0,130.0 L920.0,130.0 Q960.0,130.0 960.0,170.0 L960.0,1230.0 Q960.0,1270.0 1000.0,1270.0 L1170.0,1270.0" fill="none" stroke="#DCFFEC" stroke-opacity="0.067" stroke-linejoin="round" />
          <path id="route-glow" d="M-90.0,130.0 L920.0,130.0 Q960.0,130.0 960.0,170.0 L960.0,1230.0 Q960.0,1270.0 1000.0,1270.0 L1170.0,1270.0" fill="none" stroke="#059669" stroke-opacity="0.22" stroke-linejoin="round" filter="url(#route-blur)" />
          <path id="route-casing" d="M-90.0,130.0 L920.0,130.0 Q960.0,130.0 960.0,170.0 L960.0,1230.0 Q960.0,1270.0 1000.0,1270.0 L1170.0,1270.0" fill="none" stroke="#F7FBF7" stroke-opacity="0.84" stroke-linejoin="round" />
          <path id="route-core" d="M-90.0,130.0 L920.0,130.0 Q960.0,130.0 960.0,170.0 L960.0,1230.0 Q960.0,1270.0 1000.0,1270.0 L1170.0,1270.0" fill="none" stroke="url(#core-grad)" stroke-linejoin="round" />

          <!-- Top-down car, nose along +x. Same drawing as road.draw_car(on_light=True): ink body on light slides. -->
          <g id="car">
            <rect x="-28" y="-13" width="58" height="30" rx="9" fill="#000C08" fill-opacity="0.31" filter="url(#car-shadow)" />
            <rect x="-29" y="-15" width="58" height="30" rx="8" fill="#0F2620" />
            <rect x="5" y="-11.5" width="10" height="23" rx="3" fill="#CFE8DA" fill-opacity="0.88" />
            <rect x="-21" y="-10.5" width="7" height="21" rx="2.5" fill="#CFE8DA" fill-opacity="0.78" />
            <rect x="-13" y="-11" width="17" height="22" rx="3" fill="#24463B" />
            <ellipse cx="26" cy="-9.5" rx="2" ry="2.5" fill="#FFFAE1" />
            <ellipse cx="26" cy="9.5" rx="2" ry="2.5" fill="#FFFAE1" />
          </g>
        </svg>
      </div>

      <div id="type-layer" class="clip" data-start="0" data-duration="7" data-track-index="2">
        <div id="wordmark" class="t">KENNETH</div>
        <div id="page" class="t">04 / 05</div>
        <h1 id="headline" class="t">Tiga langkah<br />ke mobilmu.</h1>
        <p id="sub" class="t">Simpan waktu parkir, cari waktu pulang.</p>
        <div class="rule" style="top: 600px"></div>
        <div class="t step-label" style="left: 80px; top: 626px">SAAT PARKIR</div>
        <div class="t step-title" style="left: 80px; top: 656px">Simpan lokasi</div>
        <div class="t step-body" style="left: 80px; top: 704px">Lantai, zona, pilar. Tambah foto kalau perlu.</div>
        <div class="rule" style="top: 790px"></div>
        <div class="t step-label" style="left: 80px; top: 816px">SAAT PULANG</div>
        <div class="t step-title" style="left: 80px; top: 846px">Cari kendaraan</div>
        <div class="t step-body" style="left: 80px; top: 894px">Buka Aktivitas, lihat petakmu dalam 3D.</div>
        <div class="rule" style="top: 980px"></div>
        <div class="t step-label" style="left: 80px; top: 1006px">DARI LOBI</div>
        <div class="t step-title" style="left: 80px; top: 1036px">Ikuti rute</div>
        <div class="t step-body" style="left: 80px; top: 1084px">Jalan kaki dari lobi lift terdekat.</div>
        <div class="rule" style="top: 1170px"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const R = window.KENNETH_ROAD;
      const NS = "http://www.w3.org/2000/svg";
      const DURATION = 7;

      // ---- Road, drawn in the app's route order: bed, glow, casing, gradient core ----
      const svg = document.getElementById("road-svg");
      const defs = svg.querySelector("defs");
      const streets = document.getElementById("streets");
      R.streets.forEach(([a, b], i) => {
        const g = document.createElementNS(NS, "linearGradient");
        g.id = "street-" + i;
        g.setAttribute("gradientUnits", "userSpaceOnUse");
        g.setAttribute("x1", a[0]);
        g.setAttribute("y1", a[1]);
        g.setAttribute("x2", b[0]);
        g.setAttribute("y2", b[1]);
        g.innerHTML = `<stop offset="0" stop-color="${R.bed.color}" stop-opacity="${R.bed.opacity}"/><stop offset="1" stop-color="${R.bed.color}" stop-opacity="0"/>`;
        defs.appendChild(g);
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", a[0]);
        l.setAttribute("y1", a[1]);
        l.setAttribute("x2", b[0]);
        l.setAttribute("y2", b[1]);
        l.setAttribute("stroke", `url(#street-${i})`);
        l.setAttribute("stroke-width", R.sizes.street);
        streets.appendChild(l);
      });
      const widths = { bed: R.sizes.bed, "route-glow": R.sizes.glow, "route-casing": R.sizes.casing, "route-core": R.sizes.core };
      Object.entries(widths).forEach(([id, w]) => {
        const p = document.getElementById(id);
        p.setAttribute("stroke-width", w);
      });
      const bed = document.getElementById("bed");
      bed.setAttribute("stroke", R.bed.color);
      bed.setAttribute("stroke-opacity", R.bed.opacity);
      // Waypoints: white stop dots on the route, drawn under the car.
      const carEl = document.getElementById("car");
      R.waypoints.forEach(([x, y]) => {
        const outer = document.createElementNS(NS, "circle");
        outer.setAttribute("cx", x);
        outer.setAttribute("cy", y);
        outer.setAttribute("r", 11);
        outer.setAttribute("fill", "#F7FBF7");
        const inner = document.createElementNS(NS, "circle");
        inner.setAttribute("cx", x);
        inner.setAttribute("cy", y);
        inner.setAttribute("r", 5.5);
        inner.setAttribute("fill", "#059669");
        svg.insertBefore(outer, carEl);
        svg.insertBefore(inner, carEl);
      });
      document.getElementById("core-a").setAttribute("stop-color", R.colorStart);
      document.getElementById("core-b").setAttribute("stop-color", R.colorEnd);

      // ---- Car motion: steady on straights, easing off through each corner ----
      const path = document.getElementById("route-core");
      const car = document.getElementById("car");
      const L = path.getTotalLength();
      const STEP = 2;
      const n = Math.ceil(L / STEP);
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const p = path.getPointAtLength(Math.min(L, i * STEP));
        pts.push([p.x, p.y]);
      }
      const heading = (i) => {
        const a = pts[Math.max(0, i - 3)];
        const b = pts[Math.min(n, i + 3)];
        return Math.atan2(b[1] - a[1], b[0] - a[0]);
      };
      // Turn rate over a short window -> slower speed in corners.
      const time = [0];
      for (let i = 1; i <= n; i++) {
        let turn = Math.abs(heading(Math.min(n, i + 12)) - heading(Math.max(0, i - 12)));
        if (turn > Math.PI) turn = 2 * Math.PI - turn;
        let speed = 1 - 0.5 * Math.min(1, turn / (Math.PI / 2));
        R.waypoints.forEach(([wx, wy]) => {
          const d = Math.hypot(pts[i][0] - wx, pts[i][1] - wy);
          speed *= 1 - 0.6 * Math.exp(-((d / 70) ** 2));
        });
        time.push(time[i - 1] + 1 / speed);
      }
      const T = time[n];

      const drive = { t: 0 };
      function placeCar() {
        const target = drive.t * T;
        let lo = 0;
        let hi = n;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (time[mid] <= target) lo = mid;
          else hi = mid;
        }
        const f = (target - time[lo]) / (time[hi] - time[lo]);
        const x = pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f;
        const y = pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f;
        const ang = (heading(lo) * 180) / Math.PI;
        car.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${ang.toFixed(2)})`);
      }
      placeCar();

      // Car is off-frame at both ends, so the clip loops seamlessly on Instagram.
      tl.to(drive, { t: 1, duration: DURATION, ease: "none", onUpdate: placeCar }, 0);

      // Near-still atmosphere, returns to its start so the loop has no jump.
      tl.fromTo("#glow-a", { x: -10, y: 8 }, { x: 10, y: -8, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#glow-b", { x: 10, y: 0 }, { x: -8, y: -10, duration: DURATION / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
